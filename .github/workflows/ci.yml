name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SILKIT_VERSION: "5.0.6"

jobs:
  # CPack names the assets from cmake/Version.cmake, the release from the tag.
  # Its own job so a mismatch is reported before both platforms build.
  version-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Tag must match cmake/Version.cmake
        run: |
          version=$(sed -n -E \
            's/^set\(SKAB_VERSION_(MAJOR|MINOR|PATCH)[[:space:]]+([0-9]+)\).*/\2/p' \
            cmake/Version.cmake | paste -sd. -)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match cmake/Version.cmake (${version})"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches project version ${version}"

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # gRPC, Protobuf and GoogleTest come from Conan. apt's protoc and
      # grpc_cpp_plugin are left out on purpose: Conan's build modules find them
      # over PATH and would generate stubs for the wrong version.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            dpkg-dev

      # pipx is preinstalled on the runner image and unaffected by PEP 668.
      - name: Install uv
        run: pipx install uv

      # Keyed on the runner image, not runner.os: the package_id encodes the
      # compiler. compatibility.py decides which binaries are reusable.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: _build/Linux/conan2/p
          key: conan2-ubuntu-24.04-${{ hashFiles('conanfile.py', 'conan.lock', 'cmake/conan/compatibility.py') }}
          restore-keys: |
            conan2-ubuntu-24.04-

      - name: Install SilKit
        run: |
          base_url="https://github.com/vectorgrp/sil-kit/releases/download/v${SILKIT_VERSION}/"
          for pkg in \
            silkit-utils_${SILKIT_VERSION}-1ubuntu1_amd64.deb \
            libsilkit-dev_${SILKIT_VERSION}-1ubuntu1_amd64.deb \
            libsilkit5_${SILKIT_VERSION}-1ubuntu1_amd64.deb \
          ; do \
            wget "${base_url}${pkg}" -O /tmp/${pkg} && \
            sudo dpkg -i /tmp/${pkg} && \
            rm /tmp/${pkg}; \
          done

      # --build=never: a miss is reported in seconds rather than silently
      # compiling the whole graph for an hour.
      - name: Configure
        run: cmake --preset relwithdebinfo -DSKAB_CONAN_BUILD_POLICY=never

      - name: Build
        run: cmake --build --preset relwithdebinfo

      - name: Test
        run: ctest --preset relwithdebinfo --output-on-failure

      - name: Package
        run: cmake --build --preset relwithdebinfo --target package

      # A CTest case covers the build-tree binary; this is what people download.
      - name: Packaged binaries must not need protobuf or gRPC
        run: |
          set -euo pipefail
          zip=$(ls _build/Linux/relwithdebinfo/*-Linux-x86_64.zip)
          rm -rf pkg && mkdir pkg
          unzip -q "$zip" -d pkg
          # CPack nests under <package>-<version>-<platform>/; flatten it.
          mv pkg/*/ pkg/root
          ./ci/assert-static-deps.sh pkg/root/bin/*

      - name: Packaged binaries must carry their license texts
        run: |
          set -euo pipefail
          ./ci/assert-notices.sh pkg/root/share/doc/sil-kit-android-bridge/licenses

      # The 0.4.x regression was invisible until the binary ran somewhere the
      # libraries were not installed. Mount SIL Kit and nothing else.
      - name: Packaged binary starts in a bare container
        run: |
          set -euo pipefail
          rm -rf silkit-runtime && mkdir -p silkit-runtime
          cp -a /usr/lib/x86_64-linux-gnu/libSilKit.so* silkit-runtime/
          docker run --rm \
            -v "$PWD/pkg:/pkg:ro" -v "$PWD/silkit-runtime:/silkit:ro" \
            -e LD_LIBRARY_PATH=/silkit \
            ubuntu:24.04 /pkg/root/bin/sil-kit-android-bridge --version

      # Only the release job consumes these. Packaging itself still runs on every
      # build, so a broken CPack config fails in the PR rather than at tag time.
      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: packages-Linux
          path: |
            _build/Linux/relwithdebinfo/*.zip
            _build/Linux/relwithdebinfo/*.deb

  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # uv provisions the Conan 2 client into .venv (see cmake/fetch_conan.cmake);
      # ninja is the generator used by the CMake presets.
      - name: Install build tools
        run: python -m pip install --upgrade uv ninja

      # The Conan home lives inside the build tree (see cmake/fetch_conan.cmake),
      # so nothing outside the workspace is written. Keep the package cache
      # between runs: a cold cache means downloading roughly 150 MB.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: _build/Windows/conan2/p
          key: conan2-windows-2022-${{ hashFiles('conanfile.py', 'conan.lock', 'cmake/conan/compatibility.py') }}
          restore-keys: |
            conan2-windows-2022-

      - name: Install SilKit
        shell: pwsh
        run: |
          $zip = "SilKit-$env:SILKIT_VERSION-Win-x86_64-VS2019.zip"
          $url = "https://github.com/vectorgrp/sil-kit/releases/download/v$env:SILKIT_VERSION/$zip"
          $dest = Join-Path $env:RUNNER_TEMP "silkit"
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP $zip)
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP $zip) -DestinationPath $dest -Force
          # The layout inside the archive is not part of any stability guarantee,
          # so locate the package configuration instead of hardcoding a path.
          $cfg = Get-ChildItem -Path $dest -Recurse -Filter SilKitConfig.cmake |
                 Select-Object -First 1
          if (-not $cfg) { throw "SilKitConfig.cmake not found under $dest" }
          Add-Content -Path $env:GITHUB_ENV -Value "SilKit_DIR=$($cfg.Directory.FullName)"

      # One cmd step so the environment set up by vcvars64.bat survives across the
      # cmake invocations. && chaining is required: shell cmd only reports the exit
      # code of the last command. --build=never as on Linux.
      - name: Configure, build, test and package
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset relwithdebinfo -DSilKit_DIR="%SilKit_DIR%" -DSKAB_CONAN_BUILD_POLICY=never && ^
          cmake --build --preset relwithdebinfo && ^
          ctest --preset relwithdebinfo --output-on-failure && ^
          cmake --build --preset relwithdebinfo --target package

      # The dependencies are linked in here too, so the same obligation applies.
      - name: Packaged binaries must carry their license texts
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls _build/Windows/relwithdebinfo/*-Windows-x86_64.zip)
          rm -rf pkg && mkdir pkg
          unzip -q "$zip" -d pkg
          mv pkg/*/ pkg/root
          ./ci/assert-notices.sh pkg/root/share/doc/sil-kit-android-bridge/licenses

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: packages-Windows
          path: _build/Windows/relwithdebinfo/*.zip

  release:
    needs: [version-check, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The draft already exists when this job is re-run. New ones are left
          # as drafts so the archives are attached before anyone publishes -
          # under immutable releases publishing seals the assets and reserves
          # the tag forever.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --draft \
              --generate-notes
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
