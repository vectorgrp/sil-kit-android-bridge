name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SILKIT_VERSION: "5.0.6"

jobs:
  # CPack names the assets from cmake/Version.cmake, the release from the tag.
  # Its own job so a mismatch is reported before both platforms build.
  version-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Tag must match cmake/Version.cmake
        run: |
          version=$(sed -n -E \
            's/^set\(SKAB_VERSION_(MAJOR|MINOR|PATCH)[[:space:]]+([0-9]+)\).*/\2/p' \
            cmake/Version.cmake | paste -sd. -)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match cmake/Version.cmake (${version})"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches project version ${version}"

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libgtest-dev libgmock-dev \
            dpkg-dev

      - name: Install SilKit
        run: |
          base_url="https://github.com/vectorgrp/sil-kit/releases/download/v${SILKIT_VERSION}/"
          for pkg in \
            silkit-utils_${SILKIT_VERSION}-1ubuntu1_amd64.deb \
            libsilkit-dev_${SILKIT_VERSION}-1ubuntu1_amd64.deb \
            libsilkit5_${SILKIT_VERSION}-1ubuntu1_amd64.deb \
          ; do \
            wget "${base_url}${pkg}" -O /tmp/${pkg} && \
            sudo dpkg -i /tmp/${pkg} && \
            rm /tmp/${pkg}; \
          done

      - name: Configure
        run: cmake --preset relwithdebinfo

      - name: Build
        run: cmake --build --preset relwithdebinfo

      - name: Test
        run: ctest --preset relwithdebinfo --output-on-failure

      - name: Package
        run: cmake --build --preset relwithdebinfo --target package

      # Only the release job consumes these. Packaging itself still runs on every
      # build, so a broken CPack config fails in the PR rather than at tag time.
      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: packages-Linux
          path: |
            _build/Linux/relwithdebinfo/*.zip
            _build/Linux/relwithdebinfo/*.deb

  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # uv provisions the Conan 2 client into .venv (see cmake/fetch_conan.cmake);
      # ninja is the generator used by the CMake presets.
      - name: Install build tools
        run: python -m pip install --upgrade uv ninja

      # The Conan home lives inside the build tree (see cmake/fetch_conan.cmake),
      # so nothing outside the workspace is written. Keep the package cache
      # between runs: a cold cache means downloading roughly 150 MB, and a
      # compiler with no published binaries would build from source.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: _build/conan2/p
          key: conan2-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Install SilKit
        shell: pwsh
        run: |
          $zip = "SilKit-$env:SILKIT_VERSION-Win-x86_64-VS2019.zip"
          $url = "https://github.com/vectorgrp/sil-kit/releases/download/v$env:SILKIT_VERSION/$zip"
          $dest = Join-Path $env:RUNNER_TEMP "silkit"
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP $zip)
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP $zip) -DestinationPath $dest -Force
          # The layout inside the archive is not part of any stability guarantee,
          # so locate the package configuration instead of hardcoding a path.
          $cfg = Get-ChildItem -Path $dest -Recurse -Filter SilKitConfig.cmake |
                 Select-Object -First 1
          if (-not $cfg) { throw "SilKitConfig.cmake not found under $dest" }
          Add-Content -Path $env:GITHUB_ENV -Value "SilKit_DIR=$($cfg.Directory.FullName)"

      # One cmd step so the environment set up by vcvars64.bat survives across the
      # cmake invocations. && chaining is required: shell cmd only reports the exit
      # code of the last command.
      - name: Configure, build, test and package
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset relwithdebinfo -DSilKit_DIR="%SilKit_DIR%" && ^
          cmake --build --preset relwithdebinfo && ^
          ctest --preset relwithdebinfo --output-on-failure && ^
          cmake --build --preset relwithdebinfo --target package

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: packages-Windows
          path: _build/Windows/relwithdebinfo/*.zip

  release:
    needs: [version-check, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release can already exist: publishing one in the web UI creates
          # the tag that starts this workflow. New ones are left as drafts so the
          # archives are attached before anyone publishes - under immutable
          # releases publishing seals the assets and reserves the tag forever.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --draft \
              --generate-notes
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
